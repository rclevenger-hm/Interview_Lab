name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        run: |
          touch dist/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf pages-worktree
          git worktree add --detach pages-worktree
          cd pages-worktree
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -R ../dist/. .
          git add .
          git commit -m "Deploy GitHub Pages"
          git push --force origin gh-pages

      - name: Build and deploy the published Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_commit=$(git -C pages-worktree rev-parse HEAD)
          build_url=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.url')
          for attempt in $(seq 1 60); do
            build=$(gh api "$build_url")
            status=$(jq -r '.status' <<< "$build")
            commit=$(jq -r '.commit' <<< "$build")
            if [ "$status" = "built" ] && [ "$commit" = "$expected_commit" ]; then
              echo "Pages deployed commit $commit"
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              jq '.error' <<< "$build"
              exit 1
            fi
            sleep 5
          done
          echo "Pages did not deploy the expected commit within five minutes."
          exit 1
